name: Daily Medical AI Digest

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run digest
        run: python med_ai_digest.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
